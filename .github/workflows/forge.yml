name: Forge HTML -> VST3/AU

# Drop an HTML plugin page into inbox/<slug>.html (or run manually with a slug) and this:
#   1. forges it (headless boot, worklet capture, control probing, manifest) and computes the Node/V8 golden master
#   2. builds a universal macOS VST3 + AU + Standalone with JUCE 8 on Apple hardware
#   3. tests: installer, auval (Logic's gatekeeper), pluginval strictness 10, HostTest (params, state, golden master vs Node, editor), CPU with/without JIT
#   4. publishes a GitHub Release with .pkg installers
on:
  push:
    branches: [ main ]          # tags (releases such as deps-jsc) never start a build
    paths: [ 'inbox/**', 'engine/**', 'runtime/**', 'forge/**', 'tests/**', '.github/workflows/forge.yml' ]
  workflow_dispatch:
    inputs:
      slug:
        description: "inbox file to build (without .html); empty = all inbox files"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  forge:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i
      - name: Engine self-tests (reference worklet)
        run: node tests/run-analogexact.js && node tests/shim-roundtrip.js && node tests/hostparam.js
      - id: list
        name: Pick inbox files
        run: |
          for u in inbox/*.url; do [ -f "$u" ] && node forge/fetch-source.js "$u"; done || true
          ALL=$(ls inbox/*.html 2>/dev/null || true)
          if [ -n "${{ github.event.inputs.slug }}" ]; then FILES="inbox/${{ github.event.inputs.slug }}.html"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git fetch -q --no-tags --depth=1 origin "${{ github.event.before }}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
            if echo "$CHANGED" | grep -qvE '^inbox/'; then FILES="$ALL"; echo "engine/workflow changed -> building every inbox page"
            else FILES=$(echo "$CHANGED" | grep -E '^inbox/.*\.(html|url)$' | sed 's/\.url$/.html/' | sort -u | while read f; do [ -f "$f" ] && echo "$f"; done); echo "only the pushed inbox pages: $FILES"; fi
          else FILES="$ALL"; fi
          SLUGS=$(for f in $FILES; do basename "$f" .html; done | jq -R . | jq -sc .)
          echo "slugs=$SLUGS" >> $GITHUB_OUTPUT; echo "building: $SLUGS"
      - name: Forge every inbox page
        run: |
          mkdir -p plugins
          for f in $(echo '${{ steps.list.outputs.slugs }}' | jq -r '.[]'); do
            echo "::group::forge $f"
            node forge/index.js "inbox/$f.html" --out "plugins/$f" --slug "$f" --vendor "${{ github.repository_owner }}"
            node tests/golden.js "plugins/$f"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: forged-projects
          path: plugins/
          if-no-files-found: error

  mac:
    needs: forge
    if: ${{ needs.forge.outputs.slugs != '[]' && needs.forge.outputs.slugs != '' }}
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.forge.outputs.slugs) }}
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: forged-projects, path: plugins }
      - name: Import Developer ID certificates (optional; enables real signing + notarization)
        if: env.HAS_CERT != ''
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security create-keychain -p ci build.keychain; security default-keychain -s build.keychain; security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          echo "$P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          if [ -n "$INSTALLER_P12" ]; then echo "$INSTALLER_P12" | base64 --decode > inst.p12; security import inst.p12 -k build.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild; fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
          rm -f cert.p12 inst.p12
          APP_ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          INST_ID=$(security find-identity -v build.keychain | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          [ -n "$APP_ID" ] || { echo "::error::no 'Developer ID Application' identity in the .p12 — export the certificate WITH its private key from Keychain Access"; exit 1; }
          [ -n "$INST_ID" ] || echo "::warning::no 'Developer ID Installer' identity found — .pkg files will be unsigned (bundles inside are still signed + notarized)"
          echo "PLUGIN_CODESIGN_IDENTITY=$APP_ID" >> $GITHUB_ENV
          echo "PKG_SIGN_IDENTITY=$INST_ID" >> $GITHUB_ENV
          echo "PLUGIN_DEVELOPMENT_TEAM=${TEAM:-$(echo "$APP_ID" | sed -n 's/.*(\(.*\))$/\1/p')}" >> $GITHUB_ENV
          echo "signing as: $APP_ID / ${INST_ID:-<no installer cert>}"
      - name: Notary credentials (optional)
        if: env.HAS_CERT != ''
        env:
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials h2p --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --keychain "$HOME/Library/Keychains/build.keychain-db" >/dev/null
            echo "NOTARIZE=1" >> $GITHUB_ENV; echo "notarytool: App Store Connect API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APP_PW" ] && [ -n "$TEAM" ]; then
            xcrun notarytool store-credentials h2p --apple-id "$APPLE_ID" --password "$APP_PW" --team-id "$TEAM" --keychain "$HOME/Library/Keychains/build.keychain-db" >/dev/null
            echo "NOTARIZE=1" >> $GITHUB_ENV; echo "notarytool: Apple ID + app-specific password"
          else
            echo "::warning::certificate present but no notary credentials (APPLE_NOTARY_KEY_P8_BASE64 + APPLE_NOTARY_KEY_ID + APPLE_NOTARY_ISSUER_ID, or APPLE_ID + APPLE_APP_PASSWORD + APPLE_TEAM_ID) — Gatekeeper will still warn on download"
          fi
      - name: Read plugin identity
        id: id
        run: |
          cd plugins/${{ matrix.slug }}
          get() { sed -n "s/^set($1 \"\(.*\)\")$/\1/p" plugin.cmake; }
          NAME=$(get H2P_NAME); MANU=$(get H2P_MANU_CODE); CODE=$(get H2P_PLUGIN_CODE); BID=$(get H2P_BUNDLE_ID); VER=$(get H2P_VERSION)
          TARGET=$(echo "${{ matrix.slug }}" | sed 's/[^A-Za-z0-9_]/_/g')
          echo "name=$NAME" >> $GITHUB_OUTPUT; echo "manu=$MANU" >> $GITHUB_OUTPUT; echo "code=$CODE" >> $GITHUB_OUTPUT; echo "bid=$BID" >> $GITHUB_OUTPUT; echo "ver=$VER" >> $GITHUB_OUTPUT; echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "$NAME ($MANU/$CODE) target=$TARGET"; cat REPORT.md
      - name: JavaScriptCore with a working JIT (static open-source build, universal)
        # Apple's JavaScriptCore.framework only JITs in processes that carry com.apple.security.cs.allow-jit; plugin hosts
        # (Logic's AUHostingService, Cubase, ...) do not, so the worklet would run interpreted, 5-20x slower. Bun's prebuilt
        # JSC has no entitlement check and JITs wherever MAP_JIT memory exists (allow-unsigned-executable-memory, which hosts carry).
        env: { JSC_TAG: autobuild-0b6b831aef91a68bdc68a2941b1886ac73909310, MIMALLOC_COMMIT: 92ef6587c57b262f6e6abf513f7776a2f8d12aeb, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -e
          D="$RUNNER_TEMP/jsc"; mkdir -p "$D/u/lib"; cd "$D"
          # pinned tarballs: our own mirror release first (deps-jsc), upstream second; whatever came from upstream is mirrored for next time
          MIRROR="https://github.com/${{ github.repository }}/releases/download/deps-jsc"
          gh release view deps-jsc -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create deps-jsc -R "${{ github.repository }}" --prerelease --title "deps: prebuilt JavaScriptCore (bun-webkit $JSC_TAG) + mimalloc fork" --notes "Mirror of https://github.com/oven-sh/WebKit/releases/tag/$JSC_TAG (static JavaScriptCore/WTF/bmalloc, WebKit BSD/LGPL) and https://github.com/oven-sh/mimalloc @ $MIMALLOC_COMMIT (MIT), linked into every plugin so the DSP is JIT-compiled inside DAWs." || true
          fetch() { # $1 = asset name, $2 = upstream url
            if curl -sfL --retry 2 -o "$1" "$MIRROR/$1"; then echo "$1: from mirror"; else
              curl -sSfL --retry 3 -o "$1" "$2" && echo "$1: from upstream" && (gh release upload deps-jsc "$1" -R "${{ github.repository }}" --clobber >/dev/null 2>&1 && echo "  mirrored" || echo "  (mirror upload failed; continuing)"); fi; }
          for a in arm64 amd64; do
            fetch bun-webkit-macos-$a.tar.gz "https://github.com/oven-sh/WebKit/releases/download/$JSC_TAG/bun-webkit-macos-$a.tar.gz"
            mkdir -p $a && tar xzf bun-webkit-macos-$a.tar.gz -C $a && rm bun-webkit-macos-$a.tar.gz
          done
          cp -R arm64/bun-webkit/include u/include
          for l in libJavaScriptCore.a libWTF.a libbmalloc.a; do lipo -create arm64/bun-webkit/lib/$l amd64/bun-webkit/lib/$l -output u/lib/$l; done
          # that JSC build allocates through Bun's mimalloc fork (mi_theap_* API); compile its single unity TU, no malloc override
          fetch mimalloc-$MIMALLOC_COMMIT.tar.gz "https://github.com/oven-sh/mimalloc/archive/$MIMALLOC_COMMIT.tar.gz" && mkdir mi && tar xzf mimalloc-$MIMALLOC_COMMIT.tar.gz -C mi --strip-components=1
          MIFLAGS="-O2 -DNDEBUG -DMI_STATIC_LIB -DMI_SKIP_COLLECT_ON_EXIT=1 -DMI_NO_PROCESS_DETACH=1 -DMI_FREE_USE_PAGEMAP=1 -DMI_BUILD_RELEASE -DMI_CMAKE_BUILD_TYPE=release -fvisibility=hidden -Wno-deprecated -Wno-static-in-inline -Imi/include -mmacosx-version-min=13.0"
          for a in arm64 x86_64; do clang -arch $a $MIFLAGS -c mi/src/static.c -o static-$a.o; ar rcs libmimalloc-$a.a static-$a.o; done
          lipo -create libmimalloc-arm64.a libmimalloc-x86_64.a -output u/lib/libmimalloc.a
          nm -g u/lib/libmimalloc.a 2>/dev/null | grep -c " T _mi_" || true
          lipo -info u/lib/libJavaScriptCore.a; du -sh u/lib
          echo "H2P_JSC_DIR=$D/u" >> $GITHUB_ENV
      - name: Configure + build (universal, Release)
        run: |
          cd plugins/${{ matrix.slug }}
          cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DH2P_JSC_DIR="${H2P_JSC_DIR:-}" \
                -DPLUGIN_CODESIGN_IDENTITY="${PLUGIN_CODESIGN_IDENTITY:--}" -DPLUGIN_DEVELOPMENT_TEAM="${PLUGIN_DEVELOPMENT_TEAM:-}"
          # juce_vst3_helper (moduleinfo.json generator) occasionally aborts on the hosted runner; a second, incremental build retries just that step
          cmake --build build --config Release --parallel || cmake --build build --config Release --parallel
      - name: Sign + verify (+ notarize and staple the bundles when credentials exist)
        env: { NAME: "${{ steps.id.outputs.name }}", TARGET: "${{ steps.id.outputs.target }}" }
        run: |
          cd plugins/${{ matrix.slug }}/build/${TARGET}_artefacts/Release
          ID="${PLUGIN_CODESIGN_IDENTITY:--}"
          cat > "$RUNNER_TEMP/ent.plist" <<'EOT'
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.cs.allow-jit</key><true/><key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/><key>com.apple.security.cs.disable-library-validation</key><true/><key>com.apple.security.device.audio-input</key><true/></dict></plist>
          EOT
          for b in "VST3/$NAME.vst3" "AU/$NAME.component" "Standalone/$NAME.app"; do
            [ -d "$b" ] || continue
            if [ "$ID" = "-" ]; then codesign --force --deep --sign - --timestamp=none "$b"
            else codesign --force --deep --sign "$ID" --timestamp --options runtime --entitlements "$RUNNER_TEMP/ent.plist" "$b"; fi
            codesign --verify --deep --strict --verbose=2 "$b"; lipo -info "$b/Contents/MacOS/$NAME"
          done
          if [ "${NOTARIZE:-}" = "1" ]; then
            for b in "VST3/$NAME.vst3" "AU/$NAME.component" "Standalone/$NAME.app"; do
              [ -d "$b" ] || continue
              ditto -c -k --keepParent "$b" "$RUNNER_TEMP/n.zip"
              xcrun notarytool submit "$RUNNER_TEMP/n.zip" --keychain-profile h2p --keychain "$HOME/Library/Keychains/build.keychain-db" --wait --timeout 30m 2>&1 | tee "$RUNNER_TEMP/notary-$(basename "$b").log"
              grep -q "status: Accepted" "$RUNNER_TEMP/notary-$(basename "$b").log" || { SUB=$(grep -m1 -o 'id: [0-9a-f-]*' "$RUNNER_TEMP/notary-$(basename "$b").log" | head -1 | cut -d' ' -f2); xcrun notarytool log "$SUB" --keychain-profile h2p --keychain "$HOME/Library/Keychains/build.keychain-db" || true; echo "::error::notarization rejected for $b"; exit 1; }
              xcrun stapler staple "$b"; xcrun stapler validate "$b"
            done
            spctl -a -vv -t open --context context:primary-signature "Standalone/$NAME.app" 2>&1 | tee -a "$GITHUB_WORKSPACE/testlogs/gatekeeper.txt" || true
          fi
      - name: Package (.pkg installers + zips)
        env: { NAME: "${{ steps.id.outputs.name }}", TARGET: "${{ steps.id.outputs.target }}", BID: "${{ steps.id.outputs.bid }}", VER: "${{ steps.id.outputs.ver }}" }
        run: |
          cd plugins/${{ matrix.slug }}/build/${TARGET}_artefacts/Release
          mkdir -p out "$GITHUB_WORKSPACE/testlogs"; SAFE=$(echo "$NAME" | sed 's/[^A-Za-z0-9._-]/_/g')
          ditto -c -k --keepParent "VST3/$NAME.vst3" "out/$SAFE.vst3.zip"
          ditto -c -k --keepParent "AU/$NAME.component" "out/$SAFE.component.zip"
          [ -d "Standalone/$NAME.app" ] && ditto -c -k --keepParent "Standalone/$NAME.app" "out/$SAFE-Standalone.app.zip"
          SIGN=(); [ -n "${PKG_SIGN_IDENTITY:-}" ] && SIGN=(--sign "$PKG_SIGN_IDENTITY" --timestamp)
          # postinstall = the terminal ritual people do by hand, done by the installer as root instead:
          # strip quarantine, make sure the bundle carries a valid signature (ad-hoc re-sign only if it is not Developer ID signed),
          # then wipe the console user's AU cache and kick the registrar so Logic re-validates instead of showing a stale "failed" entry.
          mkpost() { mkdir -p "$1"; cat > "$1/postinstall" <<EOT
          #!/bin/bash
          B="$2"
          [ -e "\$B" ] || exit 0
          /usr/bin/xattr -cr "\$B" 2>/dev/null || true
          if ! /usr/bin/codesign --verify --deep --strict "\$B" 2>/dev/null || ! /usr/bin/codesign -dv "\$B" 2>&1 | grep -q "Authority=Developer ID"; then
            /usr/bin/codesign --force --deep --sign - --timestamp=none "\$B" 2>/dev/null || true
          fi
          /bin/chmod -R a+rX "\$B"
          U=\$(/usr/bin/stat -f %Su /dev/console 2>/dev/null); H=\$(/usr/bin/dscl . -read "/Users/\$U" NFSHomeDirectory 2>/dev/null | /usr/bin/awk '{print \$2}')
          [ -n "\$H" ] && /bin/rm -rf "\$H/Library/Caches/AudioUnitCache" "\$H/Library/Caches/com.apple.audiounits.cache" 2>/dev/null
          /usr/bin/killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOT
          chmod 755 "$1/postinstall"; }
          mkpost scripts-vst3 "/Library/Audio/Plug-Ins/VST3/$NAME.vst3"
          mkpost scripts-au "/Library/Audio/Plug-Ins/Components/$NAME.component"
          pkgbuild --component "VST3/$NAME.vst3" --install-location /Library/Audio/Plug-Ins/VST3 --identifier "$BID.vst3" --version "$VER" --scripts scripts-vst3 "${SIGN[@]}" "out/$SAFE-VST3-Installer.pkg"
          pkgbuild --component "AU/$NAME.component" --install-location /Library/Audio/Plug-Ins/Components --identifier "$BID.au" --version "$VER" --scripts scripts-au "${SIGN[@]}" "out/$SAFE-AU-Installer.pkg"
          productbuild --package "out/$SAFE-VST3-Installer.pkg" --package "out/$SAFE-AU-Installer.pkg" "${SIGN[@]}" "out/$SAFE-Installer-VST3+AU.pkg"
          if [ "${NOTARIZE:-}" = "1" ] && [ -n "${PKG_SIGN_IDENTITY:-}" ]; then
            for p in out/*.pkg; do
              xcrun notarytool submit "$p" --keychain-profile h2p --keychain "$HOME/Library/Keychains/build.keychain-db" --wait --timeout 30m 2>&1 | tee "$RUNNER_TEMP/notary-$(basename "$p").log"
              grep -q "status: Accepted" "$RUNNER_TEMP/notary-$(basename "$p").log" || { echo "::error::notarization rejected for $p"; exit 1; }
              xcrun stapler staple "$p"; xcrun stapler validate "$p"
              spctl -a -vv -t install "$p" 2>&1 | tee -a "$GITHUB_WORKSPACE/testlogs/gatekeeper.txt"
              spctl -a -t install "$p" || { echo "::error::Gatekeeper rejects $p even after notarization"; exit 1; }
            done
            echo "SIGNING_NOTE=Developer ID + notarized + stapled (${PLUGIN_CODESIGN_IDENTITY}) — Gatekeeper accepts these downloads without any workaround" >> $GITHUB_ENV
          elif [ -n "${PLUGIN_CODESIGN_IDENTITY:-}" ] && [ "${PLUGIN_CODESIGN_IDENTITY}" != "-" ]; then
            echo "SIGNING_NOTE=Developer ID signed (${PLUGIN_CODESIGN_IDENTITY}) but NOT notarized — Gatekeeper still warns on first open" >> $GITHUB_ENV
          else
            echo "SIGNING_NOTE=ad-hoc (no Apple Developer ID certificate in the repo secrets yet, see SIGNING.md). Approve the .pkg once (right-click > Open, or System Settings > Privacy & Security > Open Anyway on macOS 15); the installer strips quarantine, re-signs the bundles and resets the AU cache itself. No Terminal." >> $GITHUB_ENV
          fi
          cp ../../../REPORT.md "out/$SAFE-REPORT.md"; shasum -a 256 out/* > out/SHA256SUMS.txt; ls -la out
          echo "SAFE=$SAFE" >> $GITHUB_ENV
      - name: Install like the user does, then auval (Logic's gatekeeper)
        env: { NAME: "${{ steps.id.outputs.name }}", TARGET: "${{ steps.id.outputs.target }}", MANU: "${{ steps.id.outputs.manu }}", CODE: "${{ steps.id.outputs.code }}" }
        run: |
          cd plugins/${{ matrix.slug }}/build/${TARGET}_artefacts/Release
          # simulate a browser download: quarantine the installer and the bundles like Safari would, then install
          xattr -w com.apple.quarantine "0083;$(printf '%x' $(date +%s));Safari;00000000-0000-0000-0000-000000000000" "out/$SAFE-Installer-VST3+AU.pkg"
          sudo installer -pkg "out/$SAFE-Installer-VST3+AU.pkg" -target / -verbose
          test -d "/Library/Audio/Plug-Ins/VST3/$NAME.vst3"; test -d "/Library/Audio/Plug-Ins/Components/$NAME.component"
          for b in "/Library/Audio/Plug-Ins/VST3/$NAME.vst3" "/Library/Audio/Plug-Ins/Components/$NAME.component"; do
            codesign --verify --deep --strict --verbose=2 "$b"
            if xattr -lr "$b" | grep -q com.apple.quarantine; then echo "::error::quarantine survived the installer on $b"; exit 1; fi
          done
          echo "installed bundles: valid signature, no quarantine attribute"
          killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 2
          mkdir -p "$GITHUB_WORKSPACE/testlogs"
          auval -v aufx "$CODE" "$MANU" 2>&1 | tee "$GITHUB_WORKSPACE/testlogs/auval.txt"
          grep -q "AU VALIDATION SUCCEEDED" "$GITHUB_WORKSPACE/testlogs/auval.txt"
      - name: pluginval strictness 10 (VST3 + AU)
        env: { NAME: "${{ steps.id.outputs.name }}" }
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip && unzip -q pv.zip
          # Every test host runs under lldb: a crash inside the plugin prints a full backtrace into the log instead of a bare "exit code 1"
          # (the runners keep no DiagnosticReports). Pass/fail is read from the host's own verdict line, not lldb's exit status.
          dbg() { perl -e 'alarm shift; exec @ARGV' 1700 xcrun lldb --batch -o run -k "thread backtrace all" -k "quit 1" -- "$@"; }
          PV=./pluginval.app/Contents/MacOS/pluginval
          dbg "$PV" --strictness-level 10 --timeout-ms 900000 --validate-in-process --output-dir testlogs "/Library/Audio/Plug-Ins/VST3/$NAME.vst3" 2>&1 | tee testlogs/pluginval-vst3.txt
          grep -q "^SUCCESS" testlogs/pluginval-vst3.txt
          dbg "$PV" --strictness-level 10 --timeout-ms 900000 --validate-in-process --output-dir testlogs "/Library/Audio/Plug-Ins/Components/$NAME.component" 2>&1 | tee testlogs/pluginval-au.txt
          grep -q "^SUCCESS" testlogs/pluginval-au.txt
      - name: HostTest (params, state, golden master vs Node, editor) + CPU with/without JSC JIT
        env: { NAME: "${{ steps.id.outputs.name }}", TARGET: "${{ steps.id.outputs.target }}", H2P_DEBUG: "1" }
        run: |
          set -o pipefail
          cd plugins/${{ matrix.slug }}
          HT="build/${TARGET}HostTest_artefacts/Release/${TARGET}HostTest"
          dbg() { perl -e 'alarm shift; exec @ARGV' 1700 xcrun lldb --batch -o run -k "thread backtrace all" -k "quit 1" -- "$@"; }
          dbg "$HT" "/Library/Audio/Plug-Ins/VST3/$NAME.vst3" --editor --golden golden.json 2>&1 | tee "$GITHUB_WORKSPACE/testlogs/hosttest-vst3.txt"
          grep -q "ALL PASSED (0 failures)" "$GITHUB_WORKSPACE/testlogs/hosttest-vst3.txt"
          echo "--- AU through the same host test ---"
          dbg "$HT" "/Library/Audio/Plug-Ins/Components/$NAME.component" --golden golden.json 2>&1 | tee "$GITHUB_WORKSPACE/testlogs/hosttest-au.txt"
          grep -q "ALL PASSED (0 failures)" "$GITHUB_WORKSPACE/testlogs/hosttest-au.txt"
          echo "--- CPU with JavaScriptCore JIT disabled (worst case: hosts without the JIT entitlement) ---"
          JSC_useJIT=false dbg "$HT" "/Library/Audio/Plug-Ins/VST3/$NAME.vst3" > "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt" 2>&1 || true
          grep -q "ALL PASSED (0 failures)" "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt" || { cat "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt"; exit 1; }
          grep -E "render cost|FAIL|\[h2p" "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt" || true
          cp ~/Library/Logs/html2plugin/*.log "$GITHUB_WORKSPACE/testlogs/" 2>/dev/null || true
          grep "render cost" "$GITHUB_WORKSPACE/testlogs/hosttest-vst3.txt" "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt"
          echo "--- JavaScriptCore JIT status inside the host process (default run / JSC_useJIT=false run) ---"
          grep -h "JavaScriptCore:" "$GITHUB_WORKSPACE/testlogs/hosttest-vst3.txt" "$GITHUB_WORKSPACE/testlogs/hosttest-nojit.txt" | head -4 || echo "(no JIT probe line found)"
      - name: Crash reports (only when a test step died)
        if: failure()
        run: |
          sleep 8
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*HostTest*.ips ~/Library/Logs/DiagnosticReports/*auval*.ips ~/Library/Logs/DiagnosticReports/*pluginval*.ips 2>/dev/null | head -2); do
            echo "=== $f"; cp "$f" testlogs/ || true
            python3 - "$f" <<'PY'
          import json,sys
          raw=open(sys.argv[1],errors='replace').read().split('\n',1)
          hdr=json.loads(raw[0]); body=json.loads(raw[1])
          print(hdr.get('name'), body.get('exception',{}), body.get('termination',{}))
          print('asi:', body.get('asi'))
          imgs=body.get('usedImages',[])
          faulting=body.get('faultingThread',0)
          for t in body.get('threads',[]):
              if t.get('id')!=body['threads'][faulting].get('id') and not t.get('triggered'): continue
              print('--- faulting thread', t.get('name') or t.get('queue'))
              for fr in t.get('frames',[])[:40]:
                  img=imgs[fr.get('imageIndex',0)] if fr.get('imageIndex',0)<len(imgs) else {}
                  print('  ', img.get('name'), fr.get('symbol'), '+', fr.get('symbolLocation'), fr.get('sourceFile',''), fr.get('sourceLine',''))
          PY
          done
      - name: Which hosts allow in-process JIT? (informational)
        run: |
          for app in "/Applications/Logic Pro.app" "/Applications/GarageBand.app" "/Applications/Cubase 14.app" "/Applications/Cubase 13.app"; do
            [ -d "$app" ] && { echo "$app:"; codesign -d --entitlements :- "$app" 2>/dev/null | grep -i -A1 "jit\|unsigned-executable" || echo "  (no JIT entitlement found)"; }
          done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.slug }}-test-logs
          path: testlogs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-macOS
          path: plugins/${{ matrix.slug }}/build/${{ steps.id.outputs.target }}_artefacts/Release/out/*
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.id.outputs.name }}
          TARGET: ${{ steps.id.outputs.target }}
        run: |
          TAG="${{ matrix.slug }}-build-${{ github.run_number }}"
          CPU=$(grep -h "render cost" testlogs/hosttest-vst3.txt | head -1 | sed 's/^ *//'); CPU2=$(grep -h "render cost" testlogs/hosttest-nojit.txt | head -1 | sed 's/^ *//')
          JIT=$(grep -h "JavaScriptCore:" testlogs/hosttest-vst3.txt | head -1 | sed 's/.*JavaScriptCore: //')
          BOUND=$(grep -m1 "two-way UI binding" plugins/${{ matrix.slug }}/REPORT.md || true)
          gh release create "$TAG" plugins/${{ matrix.slug }}/build/${TARGET}_artefacts/Release/out/* --repo "${{ github.repository }}" \
            --title "$NAME — macOS VST3 + AU (build ${{ github.run_number }})" \
            --notes "$(printf 'Universal (Apple Silicon + Intel). Double-click **%s-Installer-VST3+AU.pkg** then rescan plugins in Logic / Cubase.\n\nTests on this build: installer, auval, pluginval strictness 10 (VST3 + AU), HostTest incl. golden master vs Node/V8, editor open with audio.\n\n%s\n\nCPU (HostTest, 48 kHz / 512): %s\nCPU with JIT disabled: %s\nJavaScriptCore in the test host: %s\n\nSigning: %s' "$SAFE" "$BOUND" "$CPU" "$CPU2" "${JIT:-unknown}" "${SIGNING_NOTE:-ad-hoc}")"

      - name: Notify (GitHub issue assigned to the owner → email; optional Resend email)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.id.outputs.name }}
          OUTCOME: ${{ job.status }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          TAG="${{ matrix.slug }}-build-${{ github.run_number }}"
          REL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$OUTCOME" = "success" ]; then
            TITLE="Ready: $NAME (build ${{ github.run_number }})"
            BODY=$(printf 'Your plugin passed every gate and the installers are published.\n\n**Download:** %s\n\n- `%s-Installer-VST3+AU.pkg` — both (Cubase + Logic)\n- `%s-VST3-Installer.pkg` — Cubase only\n- `%s-AU-Installer.pkg` — Logic only\n\nInstall: right-click the .pkg → Open (macOS 15: System Settings → Privacy & Security → Open Anyway), then Continue / Install. The installer strips quarantine and re-signs on your Mac; no Terminal.\n\nSigning on this build: %s\n\nRun log: %s\n\n_This issue is the notification. Close it whenever._' "$REL" "$SAFE" "$SAFE" "$SAFE" "${SIGNING_NOTE:-ad-hoc}" "$RUN")
          else
            TITLE="Failed: $NAME (build ${{ github.run_number }})"
            BODY=$(printf 'The build did not pass. Open the run and download the `%s-test-logs` artifact for auval / pluginval / HostTest output.\n\nRun: %s' "${{ matrix.slug }}" "$RUN")
          fi
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --assignee "$OWNER" --label "build" 2>/dev/null \
            || gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --assignee "$OWNER" || echo "issue creation failed (non-fatal)"
          if [ -n "$RESEND_API_KEY" ] && [ -n "$NOTIFY_EMAIL" ]; then
            HTML=$(printf '%s' "$BODY" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | awk '{printf "%s<br>", $0}')
            curl -sS -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              -d "$(jq -n --arg to "$NOTIFY_EMAIL" --arg subj "$TITLE" --arg html "$HTML" '{from:"html2plugin <onboarding@resend.dev>", to:[$to], subject:$subj, html:$html}')" \
              && echo "email sent to $NOTIFY_EMAIL" || echo "email send failed (non-fatal)"
          fi
